    const PREFECTURES = {
      "大阪府": ["大阪南港"],
      "愛媛県": ["高浜", "松山観光港", "三津浜", "八幡浜", "東予港", "由良", "泊", "大浦", "神浦"],
      "広島県": ["広島", "呉"],
      "山口県": ["柳井"],
      "大分県": ["別府", "臼杵"]
    };

    const getAllSchedules = () => {
      const all = [];
      Object.values(FERRY_DATA.companies).forEach(company => {
        Object.values(company.routes).forEach(route => {
          route.outbound?.schedule.forEach(s => all.push({ ...s, company: company.name, from: route.outbound.from, to: route.outbound.to }));
          route.inbound?.schedule.forEach(s => all.push({ ...s, company: company.name, from: route.inbound.from, to: route.inbound.to }));
        });
      });
      return all;
    };

    function FerryNavi() {
      const [mounted, setMounted] = useState(false);
      const [pref, setPref] = useState("愛媛県");
      const [fromPort, setFromPort] = useState("すべて");
      const [toPort, setToPort] = useState("すべて");
      const [currentTime, setCurrentTime] = useState("");
      const [selectedSchedule, setSelectedSchedule] = useState(null);

      const allSchedules = useMemo(() => getAllSchedules(), []);

      useEffect(() => {
        setMounted(true);
        const updateTime = () => {
          const now = new Date();
          setCurrentTime(now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0'));
        };
        updateTime();
        const timer = setInterval(updateTime, 10000);
        return () => clearInterval(timer);
      }, []);

      const handleFromPortChange = (port) => {
        setFromPort(port);
        setToPort("すべて");
      };

      const filteredByFrom = useMemo(() => {
        return allSchedules.filter(s => {
          if (fromPort === "すべて") return PREFECTURES[pref].includes(s.from);
          return s.from === fromPort;
        });
      }, [pref, fromPort, allSchedules]);

      const availableToPorts = useMemo(() => {
        return Array.from(new Set(filteredByFrom.map(s => s.to))).sort();
      }, [filteredByFrom]);

      const finalSchedules = useMemo(() => {
        const sorted = filteredByFrom
          .filter(s => toPort === "すべて" || s.to === toPort)
          .sort((a, b) => a.time.localeCompare(b.time));
          
        if (!currentTime) return sorted;
        const upcoming = sorted.filter(s => s.time >= currentTime);
        const past = sorted.filter(s => s.time < currentTime);
        return [...upcoming, ...past];
      }, [filteredByFrom, toPort, currentTime]);

      const nextShip = useMemo(() => {
        if (!currentTime || finalSchedules.length === 0) return null;
        return finalSchedules[0];
      }, [finalSchedules, currentTime]);

      return (
        <div className="min-h-screen text-slate-800 pb-20 font-sans max-w-lg mx-auto bg-white shadow-2xl relative">
          {/* Header */}
          <header className="bg-blue-500 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
            <div className="flex items-center gap-2">
              <Anchor size={20} />
              <h1 className="text-lg font-bold">瀬戸内・四国 航路ナビ</h1>
            </div>
            <div className="text-sm font-medium bg-blue-600 px-3 py-1 rounded-full">{mounted ? currentTime : "--:--"}</div>
          </header>

          {/* 検索パネル */}
          <div className="bg-white px-4 py-5 shadow-sm border-b border-slate-200 relative z-0">
            {/* 都道府県 */}
            <div className="mb-4">
              <p className="mb-2 text-xs font-bold text-blue-600 flex items-center gap-1"><MapPin size={14}/> 出発エリア</p>
              <div className="flex flex-wrap gap-2">
                {Object.keys(PREFECTURES).map(p => (
                  <button key={p} onClick={() => { setPref(p); setFromPort("すべて"); setToPort("すべて"); }}
                    className={`rounded-full px-4 py-1.5 text-sm font-semibold transition-all ${pref === p ? "bg-blue-500 text-white" : "bg-slate-100 text-slate-600 hover:bg-blue-50"}`}>
                    {p}
                  </button>
                ))}
              </div>
            </div>

            {/* 出発港 */}
            <div className="mb-4">
              <p className="mb-2 text-xs font-bold text-blue-600">出発港</p>
              <div className="flex flex-wrap gap-2">
                {["すべて", ...PREFECTURES[pref]].map(port => (
                  <button key={port} onClick={() => handleFromPortChange(port)}
                    className={`rounded-full px-4 py-1.5 text-sm font-semibold transition-all ${fromPort === port ? "bg-blue-500 text-white shadow-md shadow-blue-200" : "bg-white text-blue-600 ring-1 ring-blue-200 hover:bg-blue-50"}`}>
                    {port}
                  </button>
                ))}
              </div>
            </div>

            {/* 到着港 */}
            {availableToPorts.length > 0 && (
              <div className="pt-2 border-t border-slate-100">
                <p className="mb-2 text-xs font-bold text-emerald-600 flex items-center gap-1"><Navigation size={14}/> 到着港</p>
                <div className="flex flex-wrap gap-2">
                  {["すべて", ...availableToPorts].map(port => (
                    <button key={port} onClick={() => setToPort(port)}
                      className={`rounded-full px-4 py-1.5 text-sm font-semibold transition-all ${toPort === port ? "bg-emerald-500 text-white shadow-md shadow-emerald-200" : "bg-white text-emerald-600 ring-1 ring-emerald-200 hover:bg-emerald-50"}`}>
                      {port}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* メインビジュアル: 次の便（クリック対応） */}
          {nextShip && (
            <div 
              onClick={() => setSelectedSchedule(nextShip)}
              className="m-4 rounded-2xl bg-gradient-to-br from-blue-500 to-cyan-400 p-6 text-white shadow-lg relative overflow-hidden cursor-pointer hover:scale-[1.02] hover:shadow-xl transition-all"
              title="クリックして詳細を表示"
            >
              <Ship className="absolute -right-4 -bottom-4 opacity-10 text-white" size={120} />
              <p className="text-cyan-50 text-sm font-medium mb-1">次に出発する船</p>
              <div className="flex items-end gap-3 mb-2 relative z-10">
                <span className="text-5xl font-black tracking-tight">{nextShip.time}</span>
                <span className="text-lg font-medium mb-1 pb-1">発</span>
              </div>
              <div className="text-lg font-bold mb-3 flex items-center gap-2 relative z-10">
                {nextShip.from} <ArrowRightIcon className="text-white" /> {nextShip.to}
              </div>
              <div className="flex flex-wrap gap-2 text-xs font-medium relative z-10">
                <span className="bg-blue-600/50 px-2 py-1 rounded">{nextShip.company}</span>
                <span className="bg-white text-blue-700 px-2 py-1 rounded">{nextShip.type}</span>
                {nextShip.via && <span className="bg-blue-600/50 text-blue-50 px-2 py-1 rounded border border-blue-400">{formatViaText(nextShip.via)}経由</span>}
                {nextShip.note && <span className="bg-red-500 text-white px-2 py-1 rounded">{nextShip.note}</span>}
              </div>
            </div>
          )}

          {/* 時刻表リスト */}
          <div className="px-4 pb-8">
            <h2 className="text-sm font-bold text-slate-500 mb-3 flex items-center gap-2"><Clock size={16}/> 本日の出発便 ({finalSchedules.length}便)</h2>
            <div className="grid gap-3">
              {finalSchedules.length > 0 ? finalSchedules.map((schedule, idx) => {
                const isPast = schedule.time < currentTime;
                return (
                  <div key={idx} onClick={() => setSelectedSchedule(schedule)}
                    className={`bg-white rounded-xl p-4 shadow-sm border border-slate-200 cursor-pointer transition-all hover:border-blue-300 hover:shadow-md flex justify-between items-center ${isPast ? "opacity-50 grayscale" : ""}`}>
                    <div>
                      <div className="flex items-center gap-3 mb-1">
                        <span className="text-2xl font-bold text-slate-800">{schedule.time}</span>
                        <span className="text-sm font-bold text-slate-600">{schedule.from} → {schedule.to}</span>
                      </div>
                      <div className="flex flex-wrap items-center gap-2 text-xs text-slate-500">
                        <span className="font-medium text-blue-600">{schedule.company}</span>
                        <span className="px-1.5 py-0.5 bg-slate-100 rounded text-slate-600">{schedule.type}</span>
                        {schedule.via && <span className="text-slate-500 font-medium">{formatViaText(schedule.via)}経由</span>}
                        {schedule.note && <span className="text-red-500 font-bold bg-red-50 px-1 rounded">{schedule.note}</span>}
                      </div>
                    </div>
                    <div className="text-right shrink-0 ml-2">
                      <div className="text-sm font-bold text-slate-700">
                        {schedule.fare ? `¥${schedule.fare.toLocaleString()}` : '詳細を確認'}
                      </div>
                      <div className="text-xs text-blue-500 flex items-center gap-1 justify-end mt-1">詳細 <Info size={12}/></div>
                    </div>
                  </div>
                );
              }) : (
                <p className="text-center text-slate-500 py-8 bg-white rounded-xl border border-slate-200">該当する便がありません</p>
              )}
            </div>
          </div>

          {/* 詳細モーダル */}
          {selectedSchedule && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setSelectedSchedule(null)}>
              <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl" onClick={(e) => e.stopPropagation()}>
                <div className="bg-blue-500 p-4 flex justify-between items-start text-white">
                  <div>
                    <span className="bg-blue-600 text-xs font-bold px-2 py-1 rounded mb-2 inline-block shadow-sm">{selectedSchedule.company}</span>
                    <h3 className="text-xl font-bold">{selectedSchedule.from} → {selectedSchedule.to}</h3>
                  </div>
                  <button onClick={() => setSelectedSchedule(null)} className="p-1 hover:bg-blue-600 rounded-full transition-colors"><X size={20} /></button>
                </div>
                
                <div className="p-5">
                  <div className="flex items-center justify-between mb-4 pb-4 border-b border-slate-100">
                    <div className="text-center">
                      <p className="text-xs font-bold text-slate-400 mb-1">出発</p>
                      <p className="text-3xl font-black text-slate-800">{selectedSchedule.time}</p>
                    </div>
                    <ArrowRightIcon className="text-slate-300 w-8 h-8" />
                    <div className="text-center">
                      <p className="text-xs font-bold text-slate-400 mb-1">到着</p>
                      <p className="text-3xl font-black text-slate-800">{selectedSchedule.arrivalTime || "--:--"}</p>
                    </div>
                  </div>

                  <div className="space-y-3">
                    <div className="flex justify-between items-center text-sm">
                      <span className="text-slate-500 font-medium">船種</span>
                      <span className="font-bold text-slate-800">{selectedSchedule.type}</span>
                    </div>

                    {/* 寄港地の到着時間タイムライン表示 */}
                    {selectedSchedule.via && (
                      <div className="bg-slate-50 rounded-xl p-4 border border-slate-200 mt-2">
                        <p className="text-xs font-bold text-slate-500 mb-2 border-b border-slate-200 pb-2 flex items-center gap-1">
                          <Navigation size={12} /> 経由する港の到着予定
                        </p>
                        <div className="space-y-2">
                          {selectedSchedule.via.map((v, i) => {
                            const portName = typeof v === 'string' ? v : v.port;
                            const portTime = typeof v === 'string' ? '--:--' : v.time;
                            return (
                              <div key={i} className="flex justify-between items-center text-sm">
                                <span className="font-medium text-slate-600">{portName}</span>
                                <span className="font-bold text-slate-800">{portTime}</span>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}

                    {selectedSchedule.note && (
                      <div className="flex justify-between items-center text-sm pt-2">
                        <span className="text-slate-500 font-medium">特記事項</span>
                        <span className="font-bold text-red-500 bg-red-50 px-2 py-1 rounded shadow-sm">{selectedSchedule.note}</span>
                      </div>
                    )}
                    
                    {(selectedSchedule.fare || selectedSchedule.childFare || selectedSchedule.studentFare) && (
                      <div className="bg-slate-50 rounded-xl p-4 mt-2 border border-slate-100">
                        <p className="text-xs font-bold text-slate-400 mb-2 border-b border-slate-200 pb-2">片道 旅客運賃</p>
                        
                        {selectedSchedule.fare && (
                          <div className="flex justify-between items-center mb-1">
                            <span className="text-sm font-bold text-slate-600">大人</span>
                            <span className="text-lg font-black text-slate-800">¥{selectedSchedule.fare.toLocaleString()}</span>
                          </div>
                        )}
                        
                        {selectedSchedule.studentFare && (
                          <div className="flex justify-between items-center mb-1">
                            <span className="text-sm font-bold text-slate-600">学割</span>
                            <span className="text-lg font-black text-slate-800">¥{selectedSchedule.studentFare.toLocaleString()}</span>
                          </div>
                        )}
                        
                        {selectedSchedule.childFare && (
                          <div className="flex justify-between items-center">
                            <span className="text-sm font-bold text-slate-600">小児</span>
                            <span className="text-lg font-black text-slate-800">¥{selectedSchedule.childFare.toLocaleString()}</span>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                </div>
                <div className="bg-slate-50 p-4 text-center border-t border-slate-100">
                  <button onClick={() => setSelectedSchedule(null)} className="w-full bg-blue-500 text-white font-bold py-3 rounded-xl shadow-md hover:bg-blue-600 transition-colors">
                    閉じる
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FerryNavi />);
  </script>
</body>
</html>
